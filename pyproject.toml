[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pedwri"
version = "0.1.0"
description = "Pediatric wrist fracture detection on GRAZPEDWRI-DX with patient-level evaluation"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
]

[project.optional-dependencies]
train = [
    "ultralytics>=8.3",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
    "tqdm>=4.65",
]
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "onnxruntime>=1.17",
    "pydicom>=2.4",
    "python-multipart>=0.0.9",
]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "onnx>=1.15",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
    "tqdm>=4.65",
    "fastapi>=0.110",
    "onnxruntime>=1.17",
    "pydicom>=2.4",
    "python-multipart>=0.0.9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
